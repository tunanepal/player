<!doctype html>
<html lang="en" data-theme="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tunanepal — Play. Stake. Win.</title>
<meta name="description" content="Tunanepal — PUBG Mobile and Free Fire custom rooms and tournaments in Nepal. Post a room, take a challenge, load with eSewa or Khalti, get paid when you win.">
<meta name="theme-color" content="#F6F1E4">
<link rel="canonical" href="https://tunanepal.com/">

<meta property="og:title" content="Tunanepal — PUBG &amp; Free Fire matches in Nepal">
<meta property="og:description" content="Post a custom room, take a challenge, join tournaments. Load with eSewa or Khalti and get paid when you win.">
<meta property="og:image" content="https://tunanepal.com/icon-512.png">
<meta property="og:url" content="https://tunanepal.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tunanepal">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&family=Mukta:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./screens.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════════════ sign in ══ -->
<section id="gate" hidden>
  <div class="gate__art" aria-hidden="true">
    <svg viewBox="0 0 480 400" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="heat" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0"   stop-color="#FBE4E7"/>
          <stop offset=".55" stop-color="#F8EFE2"/>
          <stop offset="1"   stop-color="#F6F1E4"/>
        </linearGradient>
        <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#D51A34" stop-opacity=".26"/>
          <stop offset="1" stop-color="#D51A34" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#E8940C" stop-opacity=".30"/>
          <stop offset="1" stop-color="#E8940C" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="480" height="400" fill="url(#heat)"/>
      <circle cx="366" cy="86"  r="150" fill="url(#glowA)"/>
      <circle cx="104" cy="150" r="120" fill="url(#glowB)"/>
      <!-- a single corner wedge for depth; nothing that reads as a horizon -->
      <path d="M480 0 L480 118 L398 0 Z" fill="#1C1813" opacity=".06"/>
    </svg>
  </div>

  <div class="gate__body">
    <img class="brandlogo" src="./logo.png" alt="" width="76" height="76">
    <h1 class="wordmark">TUNA<em>NEPAL</em></h1>
    <p class="wordmark-sub">Post a room, take a challenge, get paid when you win.</p>

    <p class="battlecry">Are you ready for battle?</p>

    <div class="gate__card">
      <h2 id="gateTitle">Sign in</h2>
      <p class="gate__sub" id="gateSub">Your number and password.</p>

      <div class="alert alert--bad" id="gateErr" hidden></div>

      <form id="gateForm" novalidate>
        <div id="gateBody"></div>
      </form>

      <div id="gateSwitch"></div>
    </div>
  </div>
</section>

<!-- ═════════════════════════════════════════════════════════════ app ══ -->
<div id="app" hidden>

  <header class="topbar">
    <span class="avatar" id="barAvatar">T</span>
    <div class="topbar__id">
      <b id="barName" class="truncate">Player</b>
      <small id="barPhone" class="mono">—</small>
    </div>
    <button class="bell" id="bellBtn" aria-label="Notifications">
      <svg viewBox="0 0 24 24"><path d="M18 15v-4a6 6 0 1 0-12 0v4l-1.6 2.4h15.2z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      <span class="dot" id="bellDot" hidden>0</span>
    </button>
    <div class="purse">
      <small>Points</small>
      <b id="barPoints">Rs 0</b>
    </div>
  </header>

  <main>
    <!-- ───────────────────────────────────────────────────────── HOME ── -->
    <section class="screen" id="screen-home" data-on>
      <div id="installSlot" hidden></div>
      <div class="adstrip" id="adstrip" hidden></div>

      <div class="modeswitch" id="modeSwitch">
        <button data-m="rooms" aria-pressed="true">Live rooms</button>
        <button data-m="tourn" aria-pressed="false">Tournaments</button>
      </div>

      <div id="paneRooms">
        <p class="small muted" style="margin-bottom:2px">Pick a game to see the rooms waiting for an opponent.</p>

        <div class="gamepick" id="gamepick">
          <button data-game="pubg" aria-pressed="true">
            <span class="g-mark" aria-hidden="true"></span>
            <span class="g-name">PUBG</span>
            <span class="g-count">—</span>
          </button>
          <button data-game="freefire" aria-pressed="false">
            <span class="g-mark" aria-hidden="true"></span>
            <span class="g-name">Free Fire</span>
            <span class="g-count">—</span>
          </button>
        </div>

        <div id="roomList" style="margin-top:16px"></div>
      </div>

      <div id="paneTourn" hidden>
        <p class="small muted" style="margin-bottom:12px">Events run by Tunanepal. Register, get confirmed, play.</p>
        <div id="tournSlot"></div>
      </div>
    </section>

    <!-- ───────────────────────────────────────────────────────── LOAD ── -->
    <section class="screen" id="screen-load">
      <div class="section-head"><h1>Load</h1></div>
      <div id="loadBody"></div>
    </section>

    <!-- ────────────────────────────────────────────────────── CUSTOMS ── -->
    <section class="screen" id="screen-customs">
      <div class="section-head"><h1>Customs</h1></div>
      <div id="customsBody"></div>
    </section>

    <!-- ──────────────────────────────────────────────────── MY GAMES ── -->
    <section class="screen" id="screen-games">
      <div class="section-head"><h1>My games</h1></div>
      <div id="gamesBody"></div>
    </section>

    <!-- ───────────────────────────────────────────────────── SETTINGS ── -->
    <section class="screen" id="screen-settings">
      <div class="section-head"><h1>Settings</h1></div>
      <div id="settingsBody"></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button data-screen="home" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3.5l9 7v10.5H3z"/><path d="M9.5 21V14h5v7"/></svg>Home</button>
    <button data-screen="load" aria-current="false">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M16.5 15h1.8"/></svg>Load</button>
    <button data-screen="customs" aria-current="false">
      <svg viewBox="0 0 24 24"><path d="M12 4.5v15M4.5 12h15"/><circle cx="12" cy="12" r="9"/></svg>Customs</button>
    <button data-screen="games" aria-current="false">
      <svg viewBox="0 0 24 24"><path d="M7 8.5h10a4 4 0 0 1 0 8H7a4 4 0 0 1 0-8Z"/><path d="M9.5 11v3M8 12.5h3M15 12h.01M16.8 13.6h.01"/></svg>My games</button>
    <button data-screen="settings" aria-current="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.2v2.2M12 18.6v2.2M20.8 12h-2.2M5.4 12H3.2M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6M18.2 18.2l-1.6-1.6M7.4 7.4 5.8 5.8"/></svg>Settings</button>
  </nav>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
